<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>Display실습1-block</title>
    <style>
 /* 웹페이지 초기화 */
        * {

        body{
            margin: 0px;
            padding: 20px;
            background-color: #af8686;
            
        }

        div.block-box{
            background-color: #3498db;

            padding: 10px;

            /* width: 300px;
            height: 50px;

        }
.b1{width:300px;height:50px;border-radius:10px; text-align:center;line-height:50px;}
.b2{width:400px;height:400px; border-radius:200px;text-align:center;line-height:200px;}
.b3{width:500px;height:150px;border-radius:100px ;text-align:center;line-height:150px;}


    </style>

</head>
<body>
    <h2>block요소 확인</h2>
    <div class="block-box b1">div태그1-block</div>
