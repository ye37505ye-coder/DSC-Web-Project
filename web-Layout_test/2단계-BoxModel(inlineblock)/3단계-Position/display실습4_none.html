<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 실습4-None</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        div.box-visible {
            background-color: #349bdb;
            color: white;
            padding: 10px;
            margin: 5px;
        }

        div.box-none {
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            margin: 5px;
            /* display: none적용해 봅니다. */
            /* display: block적용해 봅니다. */
            display: none;
        }

        div.box-hidden {
            background-color: #9b59bd;
            color: white;
            padding: 10px;
            margin: 5px;
            /* visibility:hidden적용해 봅니다. */
            /* visibility:visible적용해 봅니다. */
            visibility: hidden;
        }
    </style>
</head>

<body>

    <div class="box-visible">①보이는 박스</div>
    <div class="box-none">②display:"none"완전히 사라짐</div>
    <div class="box-hidden">③visibility:"hidden"→공간만 남음</div>
    <div class="box-visible">④보이는 박스</div>

</body>

</html>
