<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box_model_실습3</title>
    <style>
        /* 웹페이지 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
        margin: 0px;
        padding: 30px;

        div.box3{
            width: 200px;
            height: 100px;
            background-color: #f1c40f;
            border: 3px solid #e62e22;
            padding: 20px;
            /* 박스 모델이 속성값을 적용 후 크기 */
            box-sizing: content-box;

        }

        }
    </style>

</head>

<body>
    <div class="box3">border적용박스</div>


</body>

</html>
