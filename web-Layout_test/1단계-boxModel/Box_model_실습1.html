<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box model 실습1</title>
    <style>
        /* 웹페이지 초기화 */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 기본 박스에 대한 스타일 적용 */
        div.box1{
            width: 200px;
            height: 100px;
            /*border: 1px solid black;*/
            background-color: #3498db;
            color: white;
        }
    </style>
</head>
<body>
    <div class="box1">기본 박스</div>
</body>
</html>
