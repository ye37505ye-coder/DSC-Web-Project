<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록 태그 연습</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "맑은고딕", sans-serif;
            padding: 20px;
            line-height: 1.8;
        }

        ul,ol {
            margin: 20px; 
            border: 1px solid black;
            list-style-type: none;
        }

        ul{
            padding-left: 40px;
        }
        
    </style>
</head>

<body>
    <h1>HTML 목록 태그 연습</h1>

    <!-- 순서 없는 목록 -->
    <ul>
        <li>사과</li>
        <li>바나나</li>
        <li>오렌지</li>
    </ul>

    <!-- 순서 있는 목록 -->
    <ol>
        <li>아침식사준비</li>
        <li>운동하기</li>
        <li>출근하기</li>
    </ol>
    <!-- 설명 목록 -->
    <h2>설명 목록</h2>
    <dl>
        <dt>HTML</dt>
        <dd>웹페이지의 구조를 담당하는 마크업 언어를 말한다</dd>
        <dt>CSS</dt>
        <dd>웹 페이이지의 디자인을 담당하는 스타일 언어를 말한다.</dd>
        <dt>JAVA</dt>
        <dd>웹 페이지를 동적으로 만들어 주는 스크립트 언어를 말한다</dd>


    </dl>
</body>

</html>
