<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삭제 및 추가 문서 예제</title>
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
font-family: "맑은고딕" sans-serif;
padding: 20px;
   line-height: 1.8; 
}

del{
    color: red;
}
ins{
    color: green;
    text-decoration: overline;
}

    </style>
</head>
<body>
    <h1>문서 수정 내역</h1>
    <p><del> 10월 1일(월요일)에 개강 예정이었습니다.</del><br>
       <ins> 2026년 10월 8일(월요일)에 개강이 변경되었습니다.</ins>
    </p>

    <p>
<del> 모든 수강생은 9시에 강의실로 입장해 주세요.</del><br>
<ins>모든 수강생은 10시에 강의실로 입장해 주세요.</ins>
    </p>

</body>
</html>
